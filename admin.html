<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 | 과정영상 공유 관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#0B2A5B; --navy-deep:#061B3D; --blue:#1A6FE8; --cyan:#35C8F5;
  --ink:#0C1424; --ink-2:#5D6A80; --canvas:#EEF2F8; --paper:#fff;
  --line:rgba(11,42,91,.13); --soft:#EDF3FD;
  --ok:#0E7A55; --warn:#C42D55;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;line-height:1.55;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
.hidden{display:none !important}
img{display:block;max-width:100%}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px}

/* 로그인 */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:370px;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:34px 30px}
.gate-card img{height:18px;width:auto;margin-bottom:22px;opacity:.9}
.gate-card h1{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.gate-card p{margin:0 0 24px;font-size:13px;color:var(--ink-2)}
label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-2);margin-bottom:7px}
input[type=password],input[type=text],input[type=date]{width:100%;padding:11px 13px;
  border:1.5px solid var(--line);border-radius:9px;font-size:14px;outline:none;background:var(--paper);color:var(--ink)}
input:focus{border-color:var(--blue)}
.btn{padding:11px 18px;border:0;border-radius:9px;background:var(--navy);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--blue)}
.btn[disabled]{opacity:.5;cursor:progress}
.btn.full{width:100%;margin-top:16px}
.btn.sm{padding:8px 14px;font-size:12.5px}
.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.ghost:hover{background:var(--soft);border-color:var(--blue);color:var(--navy)}
.danger{background:none;border:0;color:var(--warn);font-size:12px;font-weight:700;cursor:pointer;padding:6px}
.msg{margin-top:12px;font-size:13px;color:var(--warn);min-height:18px}

/* 레이아웃 */
header.top{background:var(--paper);border-bottom:1px solid var(--line);padding:0 24px;
  display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:10}
header.top img.logo{height:17px;width:auto;opacity:.9}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:17px 15px;font-size:13.5px;font-weight:700;
  color:var(--ink-2);cursor:pointer;border-bottom:2.5px solid transparent}
nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
header.top .right{margin-left:auto}
main{max-width:1240px;margin:0 auto;padding:24px 24px 96px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.panel-head p{margin:0;font-size:12.5px;color:var(--ink-2)}

/* 표 */
table{width:100%;border-collapse:collapse;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:var(--soft);color:var(--navy);font-size:12px;font-weight:800;
  text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.off{background:#FAFBFD;color:#9BA5B6}
td input[type=text],td input[type=date]{padding:7px 9px;font-size:13px;border-radius:7px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px}
th.ctr,td.ctr{text-align:center;width:96px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;margin:0}

/* 공유 설정 */
.perm-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:14px}
select{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;
  background:var(--paper);min-width:230px;color:var(--ink)}
.count{font-size:12.5px;color:var(--ink-2);margin-left:auto}
.count b{color:var(--navy)}
.th-check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.course-row td{background:#F5F8FE;font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.03em}
.course-row td.ctr{background:#F5F8FE}
.hint{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:0}

/* 저장 바 */
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:flex-end;
  gap:10px;align-items:center;box-shadow:0 -8px 24px -20px rgba(0,0,0,.4);z-index:15}
.savebar .state{margin-right:auto;font-size:13px;color:var(--ink-2)}
.savebar .state.ok{color:var(--ok);font-weight:700}
.savebar .state.err{color:var(--warn);font-weight:700}
.loading{padding:56px;text-align:center;color:var(--ink-2)}

@media (max-width:720px){
  header.top{padding:0 14px;gap:10px;flex-wrap:wrap}
  nav button{padding:14px 10px;font-size:13px}
  main{padding:18px 14px 96px}
  .savebar{padding:10px 14px}
  select{min-width:0;flex:1}
}
</style>
</head>
<body>

<!-- 로그인 -->
<section id="gate">
  <div class="gate-card">
    <img src="assets/kbrain-logo.png" alt="K-BRAIN" width="141" height="37">
    <h1>관리자 로그인</h1>
    <p>과정영상 공유 관리</p>
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="btn full" id="loginBtn">로그인</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</section>

<!-- 콘솔 -->
<div id="app" class="hidden">
  <header class="top">
    <img class="logo" src="assets/kbrain-logo.png" alt="K-BRAIN" width="141" height="37">
    <nav>
      <button data-tab="perms" class="on">공유 설정</button>
      <button data-tab="clients">고객사</button>
      <button data-tab="videos">영상 목록</button>
    </nav>
    <button class="btn sm ghost right" id="logoutBtn">로그아웃</button>
  </header>

  <main>
    <!-- 공유 설정 -->
    <section id="tab-perms">
      <div class="panel-head">
        <div>
          <h2>공유 설정</h2>
          <p>고객사를 고른 뒤 공유할 영상에 체크하세요. 과정 줄의 체크박스로 해당 과정을 한 번에 켜고 끌 수 있습니다.</p>
        </div>
      </div>
      <div class="perm-bar">
        <select id="permClient"></select>
        <span class="count" id="permCount"></span>
      </div>
      <table id="permTable"></table>
    </section>

    <!-- 고객사 -->
    <section id="tab-clients" class="hidden">
      <div class="panel-head">
        <div>
          <h2>고객사</h2>
          <p>접속코드는 고객사에 전달할 값입니다. 중복될 수 없습니다.</p>
        </div>
        <button class="btn sm" id="addClient">고객사 추가</button>
      </div>
      <table id="clientTable"></table>
    </section>

    <!-- 영상 -->
    <section id="tab-videos" class="hidden">
      <div class="panel-head">
        <div>
          <h2>영상 목록</h2>
          <p>Vimeo 주소창의 URL을 그대로 붙여넣으세요. 비공개 영상은 해시가 포함된 전체 URL이 필요합니다.</p>
        </div>
        <button class="btn sm" id="addVideo">영상 추가</button>
      </div>
      <table id="videoTable"></table>
    </section>
  </main>

  <div class="savebar">
    <span class="state" id="state"></span>
    <button class="btn ghost" id="reloadBtn">되돌리기</button>
    <button class="btn" id="saveBtn">저장</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxJU_SQCuGVjBshf485lOcBKRaHDe1GOr5bqWAwMQYRzqxZw8Zwobx1ZRN8y54iMoNwWw/exec';

const $ = function (s) { return document.querySelector(s); };
let PW = '';
let D = { clients: [], videos: [], perms: {} };

/* ---------- 통신 ---------- */
async function call(action, extra) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, pw: PW }, extra || {}))
  });
  return res.json();
}

/* ---------- 로그인 ---------- */
$('#loginBtn').addEventListener('click', login);
$('#pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
$('#logoutBtn').addEventListener('click', function () { location.reload(); });

async function login() {
  const btn = $('#loginBtn');
  PW = $('#pw').value;
  if (!PW) { $('#loginMsg').textContent = '비밀번호를 입력하세요.'; return; }

  btn.disabled = true; btn.textContent = '확인 중';
  try {
    const r = await call('admin.load');
    if (!r.ok) { $('#loginMsg').textContent = r.message; return; }
    D = { clients: r.clients, videos: r.videos, perms: r.perms };
    $('#gate').classList.add('hidden');
    $('#app').classList.remove('hidden');
    renderAll();
  } catch (err) {
    $('#loginMsg').textContent = '연결하지 못했습니다. 배포 URL을 확인하세요.';
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
}

/* ---------- 탭 ---------- */
document.querySelectorAll('nav button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
    ['perms', 'clients', 'videos'].forEach(function (t) {
      $('#tab-' + t).classList.toggle('hidden', t !== b.dataset.tab);
    });
    setState('');
  });
});

/* ---------- 렌더 ---------- */
function renderAll() { renderClients(); renderVideos(); renderPermClients(); renderPerms(); }

function renderClients() {
  const rows = D.clients.map(function (c, i) {
    return '<tr' + (c.active ? '' : ' class="off"') + '>' +
      '<td><input type="text" class="mono" value="' + esc(c.id) + '" data-i="' + i + '" data-f="id" style="width:78px"></td>' +
      '<td><input type="text" value="' + esc(c.name) + '" data-i="' + i + '" data-f="name"></td>' +
      '<td><input type="text" class="mono" value="' + esc(c.code) + '" data-i="' + i + '" data-f="code" style="width:130px"></td>' +
      '<td><input type="date" value="' + esc(c.expiresAt) + '" data-i="' + i + '" data-f="expiresAt" style="width:148px"></td>' +
      '<td class="ctr"><input type="checkbox" ' + (c.active ? 'checked' : '') + ' data-i="' + i + '" data-f="active"></td>' +
      '<td class="ctr"><button class="danger" data-del="' + i + '">삭제</button></td>' +
    '</tr>';
  }).join('');

  $('#clientTable').innerHTML =
    '<tr><th>고객사ID</th><th>고객사명</th><th>접속코드</th><th>만료일</th>' +
    '<th class="ctr">사용</th><th class="ctr"></th></tr>' +
    (rows || '<tr><td colspan="6" class="loading">고객사를 추가하세요.</td></tr>');

  bindEdits('#clientTable', D.clients);
  $('#clientTable').querySelectorAll('[data-del]').forEach(function (b) {
    b.addEventListener('click', function () {
      const c = D.clients[+b.dataset.del];
      if (!confirm('"' + (c.name || c.id) + '" 고객사를 삭제할까요?\n공유 설정도 함께 지워집니다.')) return;
      delete D.perms[c.id];
      D.clients.splice(+b.dataset.del, 1);
      renderAll(); setState('삭제됨 — 저장을 눌러야 반영됩니다');
    });
  });
}

function renderVideos() {
  const rows = D.videos.map(function (v, i) {
    return '<tr' + (v.active ? '' : ' class="off"') + '>' +
      '<td class="mono">' + esc(v.id) + '</td>' +
      '<td><input type="text" value="' + esc(v.course) + '" data-i="' + i + '" data-f="course" style="width:150px"></td>' +
      '<td><input type="text" value="' + esc(v.title) + '" data-i="' + i + '" data-f="title"></td>' +
      '<td><input type="text" class="mono" value="' + esc(v.url) + '" data-i="' + i + '" data-f="url" placeholder="https://vimeo.com/123456789/abcdef"></td>' +
      '<td><input type="text" value="' + esc(v.duration) + '" data-i="' + i + '" data-f="duration" style="width:66px"></td>' +
      '<td class="ctr"><input type="checkbox" ' + (v.active ? 'checked' : '') + ' data-i="' + i + '" data-f="active"></td>' +
      '<td class="ctr"><button class="danger" data-del="' + i + '">삭제</button></td>' +
    '</tr>';
  }).join('');

  $('#videoTable').innerHTML =
    '<tr><th>영상ID</th><th>과정명</th><th>영상제목</th><th>영상URL</th><th>시간</th>' +
    '<th class="ctr">사용</th><th class="ctr"></th></tr>' +
    (rows || '<tr><td colspan="7" class="loading">영상을 추가하세요.</td></tr>');

  bindEdits('#videoTable', D.videos);
  $('#videoTable').querySelectorAll('[data-del]').forEach(function (b) {
    b.addEventListener('click', function () {
      const v = D.videos[+b.dataset.del];
      if (!confirm('"' + (v.title || v.id) + '" 영상을 목록에서 삭제할까요?')) return;
      Object.keys(D.perms).forEach(function (cid) { delete D.perms[cid][v.id]; });
      D.videos.splice(+b.dataset.del, 1);
      renderAll(); setState('삭제됨 — 저장을 눌러야 반영됩니다');
    });
  });
}

function bindEdits(sel, arr) {
  $(sel).querySelectorAll('input[data-f]').forEach(function (el) {
    el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', function () {
      arr[+el.dataset.i][el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
      setState('수정됨 — 저장을 눌러야 반영됩니다');
    });
  });
}

function renderPermClients() {
  const sel = $('#permClient');
  const prev = sel.value;
  sel.innerHTML = D.clients.map(function (c) {
    return '<option value="' + esc(c.id) + '">' + esc(c.name || c.id) +
           (c.code ? ' (' + esc(c.code) + ')' : '') + '</option>';
  }).join('');
  if (prev) sel.value = prev;
}

/* 현재 고객사의 권한 객체 */
function permsOf(cid) {
  if (!D.perms[cid]) D.perms[cid] = {};
  return D.perms[cid];
}

function ensure(P, id) {
  if (!P[id]) P[id] = { play: false, download: false };
  return P[id];
}

/* 한 항목의 값을 바꾸면서 재생·다운로드 관계를 유지 */
function setFlag(P, id, key, on) {
  const p = ensure(P, id);
  p[key] = on;
  if (key === 'download' && on) p.play = true;     // 다운로드는 재생을 포함
  if (key === 'play' && !on) p.download = false;   // 재생을 끄면 다운로드도 해제
}

function renderPerms() {
  const cid = $('#permClient').value;
  const table = $('#permTable');

  if (!cid) {
    table.innerHTML = '<tr><td class="loading">고객사를 먼저 추가하세요.</td></tr>';
    $('#permCount').textContent = '';
    return;
  }
  const P = permsOf(cid);

  let html = '<tr>' +
    '<th style="width:78px">영상ID</th><th>영상제목</th>' +
    '<th class="ctr"><label class="th-check"><input type="checkbox" data-all="play">재생</label></th>' +
    '<th class="ctr"><label class="th-check"><input type="checkbox" data-all="download">다운로드</label></th>' +
  '</tr>';

  let course = null, play = 0, dl = 0;

  D.videos.forEach(function (v) {
    if (v.course !== course) {
      course = v.course;
      html += '<tr class="course-row">' +
          '<td colspan="2">' + esc(course || '기타') + '</td>' +
          '<td class="ctr"><input type="checkbox" data-course="' + esc(course) + '" data-k="play"></td>' +
          '<td class="ctr"><input type="checkbox" data-course="' + esc(course) + '" data-k="download"></td>' +
        '</tr>';
    }
    const p = P[v.id] || {};
    if (p.play) play++;
    if (p.download) dl++;

    html += '<tr' + (v.active ? '' : ' class="off"') + '>' +
      '<td class="mono">' + esc(v.id) + '</td>' +
      '<td>' + esc(v.title) + (v.active ? '' : ' <span class="hint">(사용중지)</span>') + '</td>' +
      '<td class="ctr"><input type="checkbox" data-v="' + esc(v.id) + '" data-k="play" ' + (p.play ? 'checked' : '') + '></td>' +
      '<td class="ctr"><input type="checkbox" data-v="' + esc(v.id) + '" data-k="download" ' + (p.download ? 'checked' : '') + '></td>' +
    '</tr>';
  });

  table.innerHTML = html;
  $('#permCount').innerHTML = '재생 <b>' + play + '</b> · 다운로드 <b>' + dl + '</b> / 전체 ' + D.videos.length + '편';

  syncGroupBoxes(P);

  /* 개별 항목 */
  table.querySelectorAll('input[data-v]').forEach(function (el) {
    el.addEventListener('change', function () {
      setFlag(P, el.dataset.v, el.dataset.k, el.checked);
      renderPerms();
      setState('수정됨 — 저장을 눌러야 반영됩니다');
    });
  });

  /* 과정 단위 */
  table.querySelectorAll('input[data-course]').forEach(function (el) {
    el.addEventListener('change', function () {
      const on = el.checked, k = el.dataset.k;
      D.videos.forEach(function (v) {
        if (String(v.course) !== el.dataset.course) return;
        setFlag(P, v.id, k, on);
      });
      renderPerms();
      setState('"' + el.dataset.course + '" 과정 ' + (on ? '전체 선택' : '전체 해제') +
               ' — 저장을 눌러야 반영됩니다');
    });
  });

  /* 전체 */
  table.querySelectorAll('input[data-all]').forEach(function (el) {
    el.addEventListener('change', function () {
      const on = el.checked, k = el.dataset.all;
      D.videos.forEach(function (v) { setFlag(P, v.id, k, on); });
      renderPerms();
      setState('전체 ' + (on ? '선택' : '해제') + ' — 저장을 눌러야 반영됩니다');
    });
  });
}

/* 과정·전체 체크박스 상태를 하위 항목에 맞춰 갱신 (일부만 선택되면 중간 상태) */
function syncGroupBoxes(P) {
  const table = $('#permTable');

  table.querySelectorAll('input[data-course]').forEach(function (box) {
    const k = box.dataset.k;
    const list = D.videos.filter(function (v) { return String(v.course) === box.dataset.course; });
    const on = list.filter(function (v) { return P[v.id] && P[v.id][k]; }).length;
    box.checked = list.length > 0 && on === list.length;
    box.indeterminate = on > 0 && on < list.length;
  });

  table.querySelectorAll('input[data-all]').forEach(function (box) {
    const k = box.dataset.all;
    const on = D.videos.filter(function (v) { return P[v.id] && P[v.id][k]; }).length;
    box.checked = D.videos.length > 0 && on === D.videos.length;
    box.indeterminate = on > 0 && on < D.videos.length;
  });
}

$('#permClient').addEventListener('change', function () { renderPerms(); setState(''); });

/* ---------- 추가 ---------- */
$('#addClient').addEventListener('click', function () {
  const used = {};
  D.clients.forEach(function (c) { used[c.id] = true; });
  let n = 1;
  while (used['C' + ('00' + n).slice(-3)]) n++;

  D.clients.push({ id: 'C' + ('00' + n).slice(-3), name: '', code: '', expiresAt: '', active: true });
  renderClients(); renderPermClients();
  setState('추가됨 — 고객사명과 접속코드를 입력하세요');
});

$('#addVideo').addEventListener('click', function () {
  let max = 0;
  D.videos.forEach(function (v) {
    const m = /^V(\d+)$/.exec(v.id);
    if (m) max = Math.max(max, +m[1]);
  });
  D.videos.push({ id: 'V' + ('000' + (max + 1)).slice(-3), course: '', title: '', url: '', duration: '', active: true });
  renderVideos();
  setState('추가됨 — 제목과 URL을 입력하세요');
});

/* ---------- 저장 ---------- */
$('#saveBtn').addEventListener('click', save);
$('#reloadBtn').addEventListener('click', function () {
  if (!confirm('저장하지 않은 변경사항이 사라집니다. 계속할까요?')) return;
  login();
});

async function save() {
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = '저장 중';
  setState('저장 중');

  try {
    let r = await call('admin.saveClients', { clients: D.clients });
    if (!r.ok) throw new Error(r.message);

    r = await call('admin.saveVideos', { videos: D.videos });
    if (!r.ok) throw new Error(r.message);

    r = await call('admin.savePerms', { perms: D.perms });
    if (!r.ok) throw new Error(r.message);

    setState('저장되었습니다 (' + new Date().toLocaleTimeString('ko-KR') + ')', 'ok');
  } catch (err) {
    setState('저장 실패: ' + err.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '저장';
  }
}

function setState(msg, kind) {
  const el = $('#state');
  el.textContent = msg;
  el.className = 'state' + (kind ? ' ' + kind : '');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
</script>
</body>
</html>
