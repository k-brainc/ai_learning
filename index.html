<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과정영상 라이브러리 | K-Brain</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#100B1C;          /* 본문 잉크 */
  --ink-2:#6A6280;        /* 보조 텍스트 */
  --canvas:#F2F0F7;       /* 배경 */
  --paper:#FFFFFF;
  --violet:#7132F5;       /* K-Brain 주색 */
  --violet-deep:#2B0F73;  /* 과정 밴드 */
  --amber:#E39B2C;        /* 다운로드 강조 */
  --line:rgba(16,11,28,.10);
  --shadow:0 30px 60px -40px rgba(43,15,115,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.hidden{display:none !important}
.num{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:3px;border-radius:4px}

/* ============ 접속 화면 ============ */
#gate{min-height:100dvh;display:grid;grid-template-columns:1.15fr .85fr}
.gate-art{
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(113,50,245,.55), transparent 60%),
    radial-gradient(700px 600px at 85% 90%, rgba(227,155,44,.35), transparent 55%),
    var(--violet-deep);
  color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.gate-art::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:100% 34px;mask-image:linear-gradient(180deg,transparent,#000 40%,transparent);
}
.mark{font-size:12px;font-weight:800;letter-spacing:.24em}
.gate-art h1{
  font-size:clamp(38px,4.4vw,62px);font-weight:800;line-height:1.08;
  letter-spacing:-.045em;margin:0 0 18px;position:relative;
}
.gate-art h1 em{font-style:normal;color:#D9C6FF}
.gate-art p{max-width:30ch;font-size:15px;color:rgba(255,255,255,.72);margin:0;position:relative}
.gate-meta{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.02em}

.gate-form{background:var(--paper);display:grid;place-items:center;padding:40px 44px}
.form-in{width:100%;max-width:340px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--violet);margin-bottom:14px}
.form-in h2{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.form-in>p{font-size:13.5px;color:var(--ink-2);margin:0 0 30px}
label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-2);margin-bottom:9px}
#code{
  width:100%;padding:15px 4px;border:0;border-bottom:2px solid var(--ink);
  background:none;font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:24px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  outline:none;transition:border-color .2s;
}
#code::placeholder{color:#C9C3D8;letter-spacing:.18em}
#code:focus{border-bottom-color:var(--violet)}
.enter{
  width:100%;margin-top:26px;padding:15px;border-radius:99px;background:var(--ink);color:#fff;
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;transition:background .2s,transform .12s;
}
.enter:hover{background:var(--violet)}
.enter:active{transform:scale(.985)}
.enter[disabled]{opacity:.5;cursor:progress}
.msg{margin-top:16px;font-size:13px;color:#C42D55;min-height:20px;line-height:1.5}

/* ============ 라이브러리 ============ */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(242,240,247,.86);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
  padding:14px 40px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.bar .who{font-size:15px;font-weight:800;letter-spacing:-.02em}
.bar .sep{width:1px;height:14px;background:var(--line)}
.bar .meta{font-size:12.5px;color:var(--ink-2)}
.bar .out{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:7px 14px;
  border:1px solid var(--line);border-radius:99px;transition:.15s}
.bar .out:hover{border-color:var(--ink);color:var(--ink)}

.lede{padding:56px 40px 30px;max-width:1280px;margin:0 auto}
.lede h2{font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.045em;margin:0 0 10px;line-height:1.14}
.lede p{font-size:14.5px;color:var(--ink-2);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px 100px}

/* 과정 밴드 */
.band{
  background:var(--paper);border-radius:22px;padding:30px;margin-bottom:22px;
  display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:34px;
  box-shadow:0 2px 3px rgba(16,11,28,.03);
}
.stage{position:relative}
.stage-inner{position:sticky;top:88px}
.course-no{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--violet);margin-bottom:9px}
.course-name{font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.04em;line-height:1.18;margin:0 0 12px}
.course-stat{font-size:12.5px;color:var(--ink-2);margin:0 0 20px}
.course-stat b{color:var(--ink);font-weight:700}

.preview{
  position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:linear-gradient(140deg,var(--violet-deep),#5B21C7);
  box-shadow:var(--shadow);
}
.preview img{width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .45s ease}
.preview img.on{opacity:1}
.preview::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(12,6,28,.72) 0%,transparent 52%);
}
.preview-cap{
  position:absolute;left:18px;right:18px;bottom:15px;z-index:2;color:#fff;
  font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.45;
  text-shadow:0 1px 12px rgba(0,0,0,.4);
}

/* 차시 목록 */
.eps{list-style:none;margin:0;padding:0}
.ep{
  display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:14px;
  padding:13px 12px;border-radius:12px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:background .16s;
}
.ep:last-child{border-bottom:0}
.ep:hover,.ep.active{background:#F6F3FF}
.ep-no{font-size:12.5px;font-weight:700;color:#B7AFCB;transition:color .16s}
.ep:hover .ep-no,.ep.active .ep-no{color:var(--violet)}
.ep-title{font-size:14.5px;font-weight:600;letter-spacing:-.015em;line-height:1.45}
.ep-side{display:flex;align-items:center;gap:10px}
.ep-dur{font-size:12px;color:var(--ink-2)}
.dl{
  display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;
  background:rgba(227,155,44,.14);color:#96620E;transition:.16s;
}
.dl:hover{background:var(--amber);color:#fff}
.dl svg{width:15px;height:15px;display:block}
.play-dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid #D6CFE6;transition:.16s}
.ep:hover .play-dot,.ep.active .play-dot{background:var(--violet);border-color:var(--violet)}

.empty{background:var(--paper);border-radius:22px;padding:70px 24px;text-align:center}
.empty h3{font-size:17px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
.empty p{font-size:13.5px;color:var(--ink-2);margin:0}

/* ============ 플레이어 ============ */
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:rgba(9,5,20,.9);backdrop-filter:blur(6px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.player{width:100%;max-width:1020px}
.player-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:14px;color:#fff}
.player-head .pc{font-size:11px;font-weight:800;letter-spacing:.18em;color:#B79BFF;margin-bottom:5px}
.player-head strong{font-size:17px;font-weight:700;letter-spacing:-.02em;display:block}
.close{margin-left:auto;color:#fff;font-size:15px;font-weight:700;padding:8px 15px;
  border:1px solid rgba(255,255,255,.28);border-radius:99px;transition:.15s;flex-shrink:0}
.close:hover{background:#fff;color:var(--ink)}
.frame{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.frame iframe{width:100%;height:100%;border:0}

/* ============ 반응형 ============ */
@media (max-width:1000px){
  #gate{grid-template-columns:1fr}
  .gate-art{padding:44px 32px;gap:34px}
  .gate-form{padding:44px 32px 60px}
  .band{grid-template-columns:1fr;gap:24px;padding:22px}
  .stage-inner{position:static}
}
@media (max-width:640px){
  .bar{padding:12px 18px}
  .lede{padding:36px 18px 22px}
  .wrap{padding:0 18px 70px}
  .ep{grid-template-columns:30px 1fr;gap:10px;padding:12px 8px}
  .ep-side{grid-column:2;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- 접속 -->
<section id="gate">
  <div class="gate-art">
    <div class="mark">K-BRAIN E-LEARNING</div>
    <div>
      <h1>귀사를 위해<br>준비된 과정을<br><em>지금 여기서.</em></h1>
      <p>담당자가 전달한 접속코드 하나로 공유된 모든 과정영상을 바로 볼 수 있습니다.</p>
    </div>
    <div class="gate-meta">교육 문의 · K-Brain HRD사업본부</div>
  </div>

  <div class="gate-form">
    <div class="form-in">
      <div class="eyebrow">ACCESS</div>
      <h2>접속코드 입력</h2>
      <p>코드를 받지 못하셨다면 사내 교육 담당자에게 문의해 주세요.</p>
      <label for="code">접속코드</label>
      <input type="text" id="code" placeholder="ELEC2026" autocomplete="off" spellcheck="false">
      <button class="enter" id="enterBtn">과정 열기</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</section>

<!-- 라이브러리 -->
<div id="library" class="hidden">
  <div class="bar">
    <span class="who" id="clientName"></span>
    <span class="sep"></span>
    <span class="meta" id="meta"></span>
    <button class="out" id="outBtn">나가기</button>
  </div>

  <div class="lede">
    <h2 id="lede-title"></h2>
    <p>차시에 마우스를 올리면 미리보기가 바뀝니다. 제목을 누르면 재생됩니다.</p>
  </div>

  <div class="wrap" id="list"></div>
</div>

<!-- 플레이어 -->
<div id="modal" class="hidden">
  <div class="player">
    <div class="player-head">
      <div>
        <div class="pc" id="playingCourse"></div>
        <strong id="playingTitle"></strong>
      </div>
      <button class="close" id="closeBtn">닫기</button>
    </div>
    <div class="frame"><iframe id="vimeo" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxJU_SQCuGVjBshf485lOcBKRaHDe1GOr5bqWAwMQYRzqxZw8Zwobx1ZRN8y54iMoNwWw/exec';

const $ = function (s) { return document.querySelector(s); };
let DATA = null;
const THUMB = {};   /* 영상ID → 썸네일 URL */

const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/>' +
  '<path d="M4 21h16"/></svg>';

$('#enterBtn').addEventListener('click', enter);
$('#code').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });
$('#closeBtn').addEventListener('click', closePlayer);
$('#modal').addEventListener('click', function (e) { if (e.target === this) closePlayer(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayer(); });
$('#outBtn').addEventListener('click', function () { location.reload(); });

/* ---------- 접속 ---------- */
async function enter() {
  const code = $('#code').value.trim();
  const btn = $('#enterBtn');
  $('#msg').textContent = '';
  if (!code) { $('#msg').textContent = '접속코드를 입력해 주세요.'; return; }

  btn.disabled = true; btn.textContent = '확인 중';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'access', code: code })
    });
    const data = await res.json();
    if (!data.ok) { $('#msg').textContent = data.message; return; }
    DATA = data;
    render();
  } catch (err) {
    $('#msg').textContent = '연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.';
  } finally {
    btn.disabled = false; btn.textContent = '과정 열기';
  }
}

/* ---------- 렌더 ---------- */
function render() {
  $('#gate').classList.add('hidden');
  $('#library').classList.remove('hidden');

  const courses = groupByCourse(DATA.items);
  const nCourse = Object.keys(courses).length;

  $('#clientName').textContent = DATA.client;
  $('#meta').textContent = DATA.expiresAt
    ? '이용 기간 ' + DATA.expiresAt + '까지'
    : '이용 기간 제한 없음';
  $('#lede-title').textContent = nCourse
    ? nCourse + '개 과정 · 영상 ' + DATA.items.length + '편이 열려 있습니다'
    : '';

  const list = $('#list');
  if (!DATA.items.length) {
    list.innerHTML = '<div class="empty"><h3>아직 열린 과정이 없습니다</h3>' +
      '<p>사내 교육 담당자에게 공유 설정을 요청해 주세요.</p></div>';
    return;
  }

  list.innerHTML = Object.keys(courses).map(function (name, ci) {
    const eps = courses[name];
    const dlCount = eps.filter(function (v) { return v.canDownload; }).length;

    const rows = eps.map(function (v, i) {
      const dl = v.canDownload
        ? '<a class="dl" href="' + esc(v.downloadUrl) + '" download title="다운로드" ' +
          'onclick="event.stopPropagation()">' + DL_ICON + '</a>'
        : '';
      return '<li><button class="ep" data-id="' + esc(v.id) + '">' +
          '<span class="ep-no num">' + ('0' + (i + 1)).slice(-2) + '</span>' +
          '<span class="ep-title">' + esc(v.title) + '</span>' +
          '<span class="ep-side">' +
            (v.duration ? '<span class="ep-dur num">' + esc(v.duration) + '</span>' : '') +
            dl + '<span class="play-dot"></span>' +
          '</span>' +
        '</button></li>';
    }).join('');

    return '<section class="band" data-band="' + ci + '">' +
        '<div class="stage"><div class="stage-inner">' +
          '<div class="course-no num">과정 ' + ('0' + (ci + 1)).slice(-2) + '</div>' +
          '<h3 class="course-name">' + esc(name) + '</h3>' +
          '<p class="course-stat"><b>' + eps.length + '차시</b>' +
            (dlCount ? ' · 다운로드 가능 ' + dlCount + '편' : ' · 재생 전용') + '</p>' +
          '<div class="preview" data-prev="' + ci + '">' +
            '<img alt="" data-img="' + ci + '">' +
            '<div class="preview-cap" data-cap="' + ci + '">' + esc(eps[0].title) + '</div>' +
          '</div>' +
        '</div></div>' +
        '<ul class="eps">' + rows + '</ul>' +
      '</section>';
  }).join('');

  bindBands(courses);
  loadThumbs(DATA.items);
}

function groupByCourse(items) {
  const g = {};
  items.forEach(function (v) { (g[v.course] = g[v.course] || []).push(v); });
  return g;
}

function bindBands(courses) {
  const names = Object.keys(courses);

  document.querySelectorAll('.band').forEach(function (band) {
    const ci = band.dataset.band;
    const eps = courses[names[ci]];
    const img = band.querySelector('[data-img="' + ci + '"]');
    const cap = band.querySelector('[data-cap="' + ci + '"]');

    band.querySelectorAll('.ep').forEach(function (btn, i) {
      const v = eps[i];

      const show = function () {
        band.querySelectorAll('.ep').forEach(function (x) { x.classList.remove('active'); });
        btn.classList.add('active');
        cap.textContent = v.title;
        applyThumb(img, v.id);
      };

      btn.addEventListener('mouseenter', show);
      btn.addEventListener('focus', show);
      btn.addEventListener('click', function () { openPlayer(v); });
    });

    band.querySelector('.preview').addEventListener('click', function () {
      const active = band.querySelector('.ep.active');
      const idx = active ? [].indexOf.call(band.querySelectorAll('.ep'), active) : 0;
      openPlayer(eps[idx]);
    });
  });
}

/* ---------- 썸네일 (Vimeo oEmbed) ---------- */
async function loadThumbs(items) {
  for (const v of items) {
    if (!v.url || THUMB[v.id]) continue;
    try {
      const r = await fetch('https://vimeo.com/api/oembed.json?width=960&url=' +
        encodeURIComponent(v.url));
      if (!r.ok) continue;
      const j = await r.json();
      if (j.thumbnail_url) {
        THUMB[v.id] = j.thumbnail_url;
        seedFirst(v.id);
      }
    } catch (e) { /* 썸네일은 없어도 무방 */ }
  }
}

/* 각 과정의 첫 차시 썸네일이 도착하면 미리보기에 채운다 */
function seedFirst(id) {
  const courses = groupByCourse(DATA.items);
  Object.keys(courses).forEach(function (name, ci) {
    if (courses[name][0].id !== id) return;
    const img = document.querySelector('[data-img="' + ci + '"]');
    if (img && !img.dataset.set) applyThumb(img, id);
  });
}

function applyThumb(img, id) {
  const src = THUMB[id];
  if (!src) { img.classList.remove('on'); return; }
  img.dataset.set = '1';
  if (img.src === src) { img.classList.add('on'); return; }
  img.classList.remove('on');
  img.onload = function () { img.classList.add('on'); };
  img.src = src;
}

/* ---------- 플레이어 ---------- */
function openPlayer(v) {
  if (!v || !v.embedUrl) return;
  $('#vimeo').src = v.embedUrl + '&autoplay=1';
  $('#playingCourse').textContent = v.course;
  $('#playingTitle').textContent = v.title;
  $('#modal').classList.remove('hidden');
  $('#closeBtn').focus();
}

function closePlayer() {
  $('#vimeo').src = '';
  $('#modal').classList.add('hidden');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
</script>
</body>
</html>
