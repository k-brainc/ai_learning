<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과정영상 라이브러리 | K-BRAIN</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#0B2A5B;        /* K-BRAIN 로고 네이비 */
  --navy-deep:#061B3D;
  --blue:#1A6FE8;        /* 커버 이미지 주색 */
  --cyan:#35C8F5;
  --ink:#0C1424;
  --ink-2:#5D6A80;
  --canvas:#EEF2F8;
  --paper:#FFFFFF;
  --amber:#E08A1E;
  --line:rgba(11,42,91,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none !important}
.num{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:4px}
img{display:block;max-width:100%}
.logo-w,.bar .logo{width:auto;max-width:none}

/* ============ 접속 ============ */
#gate{min-height:100dvh;display:grid;grid-template-columns:1.1fr .9fr}
.gate-art{
  position:relative;overflow:hidden;color:#fff;padding:44px 56px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,var(--navy-deep) 0%,var(--navy) 45%,#12498F 100%);
}
.gate-art::before{
  content:'';position:absolute;width:780px;height:780px;right:-260px;top:-180px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(53,200,245,.4), transparent 62%);
}
.logo-w{position:relative;align-self:flex-start;height:19px;width:auto;max-width:none;
  filter:brightness(0) invert(1);opacity:.95}
.gate-copy{position:relative}
.gate-copy h1{
  font-size:clamp(36px,4.2vw,58px);font-weight:800;line-height:1.1;
  letter-spacing:-.048em;margin:0 0 16px;
}
.gate-copy h1 em{font-style:normal;color:var(--cyan)}
.gate-copy p{max-width:31ch;font-size:15px;color:rgba(255,255,255,.7);margin:0}
.strip{position:relative;display:flex;gap:10px;margin-top:34px}
.strip img{width:92px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.65)}
.gate-foot{font-size:12px;color:rgba(255,255,255,.5);position:relative}

.gate-form{background:var(--paper);display:grid;place-items:center;padding:40px 44px}
.form-in{width:100%;max-width:330px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--blue);margin-bottom:14px}
.form-in h2{font-size:23px;font-weight:800;letter-spacing:-.035em;margin:0 0 8px}
.form-in>p{font-size:13.5px;color:var(--ink-2);margin:0 0 30px}
label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-2);margin-bottom:9px}
#code{
  width:100%;padding:14px 4px;border:0;border-bottom:2px solid var(--navy);background:none;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:23px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;outline:none;transition:border-color .2s;color:var(--navy);
}
#code::placeholder{color:#BDC8D8}
#code:focus{border-bottom-color:var(--blue)}
.enter{
  width:100%;margin-top:26px;padding:15px;border-radius:99px;background:var(--navy);color:#fff;
  font-size:14.5px;font-weight:700;transition:background .2s,transform .12s;
}
.enter:hover{background:var(--blue)}
.enter:active{transform:scale(.985)}
.enter[disabled]{opacity:.5;cursor:progress}
.msg{margin-top:16px;font-size:13px;color:#C42D55;min-height:20px;line-height:1.5}

/* ============ 라이브러리 ============ */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(238,242,248,.88);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
  padding:13px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.bar .logo{height:18px;width:auto;opacity:.92}
.bar .sep{width:1px;height:15px;background:var(--line)}
.bar .who{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.bar .meta{font-size:12.5px;color:var(--ink-2)}
.bar .out{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink-2);
  padding:7px 15px;border:1px solid var(--line);border-radius:99px;transition:.15s}
.bar .out:hover{border-color:var(--navy);color:var(--navy)}

.lede{max-width:1280px;margin:0 auto;padding:52px 40px 28px}
.lede h2{font-size:clamp(27px,3.2vw,40px);font-weight:800;letter-spacing:-.045em;margin:0 0 9px;line-height:1.16}
.lede p{font-size:14px;color:var(--ink-2);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px 100px}

/* 과정 밴드 */
.band{
  background:var(--paper);border-radius:20px;overflow:hidden;margin-bottom:20px;
  display:grid;grid-template-columns:minmax(300px,40%) 1fr;
  box-shadow:0 1px 2px rgba(11,42,91,.05);
}
.cover{position:relative;min-height:100%;background:var(--navy);cursor:pointer}
.cover img{width:100%;height:100%;object-fit:cover;min-height:230px}
.cover::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(4,16,38,.88) 0%,rgba(4,16,38,.18) 55%,transparent 82%)}
.cover-txt{position:absolute;left:26px;right:26px;bottom:22px;z-index:2;color:#fff}
.course-no{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--cyan);margin-bottom:8px}
.course-name{font-size:clamp(21px,2.2vw,27px);font-weight:800;letter-spacing:-.04em;
  line-height:1.2;margin:0 0 10px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.course-stat{font-size:12.5px;color:rgba(255,255,255,.72);margin:0}
.course-stat b{color:#fff;font-weight:700}
.now{margin-top:14px;font-size:13px;font-weight:600;color:#fff;line-height:1.45;
  padding-left:11px;border-left:2.5px solid var(--cyan);opacity:0;transform:translateY(4px);
  transition:opacity .25s,transform .25s}
.now.on{opacity:1;transform:none}

.eps{list-style:none;margin:0;padding:14px 20px}
.ep{
  display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:13px;
  padding:12px 10px;border-radius:11px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:background .16s;
}
.eps li:last-child .ep{border-bottom:0}
.ep:hover,.ep.active{background:#F1F6FE}
.ep-no{font-size:12.5px;font-weight:700;color:#AEBACC;transition:color .16s}
.ep:hover .ep-no,.ep.active .ep-no{color:var(--blue)}
.ep-title{font-size:14.5px;font-weight:600;letter-spacing:-.018em;line-height:1.45}
.ep-side{display:flex;align-items:center;gap:9px}
.ep-dur{font-size:12px;color:var(--ink-2)}
.dl{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:8px;
  background:rgba(224,138,30,.13);color:#96620E;transition:.16s}
.dl:hover{background:var(--amber);color:#fff}
.dl svg{width:15px;height:15px}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #CBD5E3;transition:.16s}
.ep:hover .dot,.ep.active .dot{background:var(--blue);border-color:var(--blue)}

.empty{background:var(--paper);border-radius:20px;padding:70px 24px;text-align:center}
.empty h3{font-size:17px;font-weight:800;margin:0 0 8px;letter-spacing:-.025em}
.empty p{font-size:13.5px;color:var(--ink-2);margin:0}

/* ============ 플레이어 ============ */
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:rgba(4,12,28,.92);backdrop-filter:blur(6px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.player{width:100%;max-width:1020px}
.player-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:14px;color:#fff}
.player-head .pc{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--cyan);margin-bottom:5px}
.player-head strong{font-size:17px;font-weight:700;letter-spacing:-.02em}
.close{margin-left:auto;color:#fff;font-size:14px;font-weight:700;padding:8px 16px;
  border:1px solid rgba(255,255,255,.3);border-radius:99px;transition:.15s;flex-shrink:0}
.close:hover{background:#fff;color:var(--ink)}
.frame{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.frame iframe{width:100%;height:100%;border:0}

/* ============ 반응형 ============ */
@media (max-width:1000px){
  #gate{grid-template-columns:1fr}
  .gate-art{padding:38px 28px;gap:30px}
  .gate-form{padding:40px 28px 56px}
  .band{grid-template-columns:1fr}
  .cover img{min-height:200px}
}
@media (max-width:640px){
  .bar{padding:11px 18px;gap:12px}
  .bar .meta{display:none}
  .lede{padding:34px 18px 20px}
  .wrap{padding:0 18px 70px}
  .cover-txt{left:18px;right:18px;bottom:18px}
  .eps{padding:8px 12px}
  .ep{grid-template-columns:28px 1fr;gap:9px}
  .ep-side{grid-column:2;padding-top:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- 접속 -->
<section id="gate">
  <div class="gate-art">
    <img class="logo-w" src="assets/kbrain-logo.png" alt="K-BRAIN" width="141" height="37">
    <div class="gate-copy">
      <h1>귀사를 위해 열린<br><em>AI 역량 과정</em></h1>
      <p>담당자가 전달한 접속코드 하나로 공유된 모든 과정영상을 바로 보실 수 있습니다.</p>
      <div class="strip">
        <img src="assets/course-1.jpg" alt="">
        <img src="assets/course-4.jpg" alt="">
        <img src="assets/course-6.jpg" alt="">
      </div>
    </div>
    <div class="gate-foot">K-BRAIN HRD사업본부 · 교육 문의는 담당자에게</div>
  </div>

  <div class="gate-form">
    <div class="form-in">
      <div class="eyebrow">ACCESS</div>
      <h2>접속코드 입력</h2>
      <p>코드를 받지 못하셨다면 사내 교육 담당자에게 문의해 주세요.</p>
      <label for="code">접속코드</label>
      <input type="text" id="code" placeholder="ELEC2026" autocomplete="off" spellcheck="false">
      <button class="enter" id="enterBtn">과정 열기</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</section>

<!-- 라이브러리 -->
<div id="library" class="hidden">
  <div class="bar">
    <img class="logo" src="assets/kbrain-logo.png" alt="K-BRAIN" width="141" height="37">
    <span class="sep"></span>
    <span class="who" id="clientName"></span>
    <span class="meta" id="meta"></span>
    <button class="out" id="outBtn">나가기</button>
  </div>

  <div class="lede">
    <h2 id="lede-title"></h2>
    <p>과정별 차시 목록입니다. 제목을 누르면 바로 재생됩니다.</p>
  </div>

  <div class="wrap" id="list"></div>
</div>

<!-- 플레이어 -->
<div id="modal" class="hidden">
  <div class="player">
    <div class="player-head">
      <div>
        <div class="pc" id="playingCourse"></div>
        <strong id="playingTitle"></strong>
      </div>
      <button class="close" id="closeBtn">닫기</button>
    </div>
    <div class="frame"><iframe id="vimeo" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxJU_SQCuGVjBshf485lOcBKRaHDe1GOr5bqWAwMQYRzqxZw8Zwobx1ZRN8y54iMoNwWw/exec';

/* 과정명 → 커버 이미지.
   비교할 때 띄어쓰기·괄호·기호는 무시하므로 시트 과정명이 조금 달라도 매칭됩니다. */
const COVERS = {
  'AI리터러시와업무활용':         'assets/course-1.jpg',
  '데이터리터러시':               'assets/course-2.jpg',
  '관리자AI리더십':               'assets/course-3.jpg',
  '생성형AI활용노코드데이터분석':  'assets/course-4.jpg',
  'AI행정융합기획':               'assets/course-5.jpg',
  '노코드AI서비스구현':           'assets/course-6.jpg',
  '생성형AI활용데이터분석심화':    'assets/course-7.jpg'
};

const $ = function (s) { return document.querySelector(s); };
let DATA = null;

const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/>' +
  '<path d="M4 21h16"/></svg>';

$('#enterBtn').addEventListener('click', function () { enter(false); });
$('#code').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(false); });
$('#closeBtn').addEventListener('click', closePlayer);
$('#modal').addEventListener('click', function (e) { if (e.target === this) closePlayer(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayer(); });

$('#outBtn').addEventListener('click', function () {
  try { sessionStorage.removeItem('kb_code'); sessionStorage.removeItem('kb_scroll'); } catch (e) {}
  location.reload();
});

/* 새로고침 대비: 접속코드와 스크롤 위치를 세션에 보관 */
function saveScroll() {
  if (!DATA) return;
  try { sessionStorage.setItem('kb_scroll', String(window.scrollY)); } catch (e) {}
}
window.addEventListener('beforeunload', saveScroll);
window.addEventListener('pagehide', saveScroll);

/* 페이지가 열릴 때 이전 세션이 있으면 그대로 복원 */
window.addEventListener('DOMContentLoaded', function () {
  let saved = '';
  try { saved = sessionStorage.getItem('kb_code') || ''; } catch (e) {}
  if (!saved) return;
  $('#code').value = saved;
  enter(true);
});

/* ---------- 접속 ---------- */
async function enter(restoring) {
  const code = $('#code').value.trim();
  const btn = $('#enterBtn');
  $('#msg').textContent = '';
  if (!code) { $('#msg').textContent = '접속코드를 입력해 주세요.'; return; }

  btn.disabled = true; btn.textContent = restoring ? '불러오는 중' : '확인 중';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'access', code: code })
    });
    const data = await res.json();
    if (!data.ok) {
      /* 복원 중 실패했다면 저장된 코드를 버리고 입력 화면으로 */
      try { sessionStorage.removeItem('kb_code'); } catch (e) {}
      $('#msg').textContent = data.message;
      return;
    }
    try { sessionStorage.setItem('kb_code', code); } catch (e) {}
    DATA = data;
    render(restoring);
  } catch (err) {
    $('#msg').textContent = '연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.';
  } finally {
    btn.disabled = false; btn.textContent = '과정 열기';
  }
}

/* ---------- 커버 매칭 ---------- */
function coverFor(course) {
  const key = String(course).replace(/[\s()\[\]·.,\-_\/]/g, '');
  if (COVERS[key]) return COVERS[key];
  const hit = Object.keys(COVERS).filter(function (k) {
    return key.indexOf(k) >= 0 || k.indexOf(key) >= 0;
  })[0];
  return hit ? COVERS[hit] : '';
}

/* ---------- 렌더 ---------- */
function render(restoring) {
  $('#gate').classList.add('hidden');
  $('#library').classList.remove('hidden');

  const courses = groupByCourse(DATA.items);
  const names = Object.keys(courses);

  $('#clientName').textContent = DATA.client;
  $('#meta').textContent = DATA.expiresAt ? '이용 기간 ' + DATA.expiresAt + '까지' : '';
  $('#lede-title').textContent = names.length
    ? names.length + '개 과정 · 영상 ' + DATA.items.length + '편이 열려 있습니다' : '';

  const list = $('#list');
  if (!DATA.items.length) {
    list.innerHTML = '<div class="empty"><h3>아직 열린 과정이 없습니다</h3>' +
      '<p>사내 교육 담당자에게 공유 설정을 요청해 주세요.</p></div>';
    return;
  }

  list.innerHTML = names.map(function (name, ci) {
    const eps = courses[name];
    const dlCount = eps.filter(function (v) { return v.canDownload; }).length;
    const cover = coverFor(name);

    const rows = eps.map(function (v, i) {
      const dl = v.canDownload
        ? '<a class="dl" href="' + esc(v.downloadUrl) + '" download title="다운로드" ' +
          'onclick="event.stopPropagation()">' + DL_ICON + '</a>' : '';
      return '<li><button class="ep" data-id="' + esc(v.id) + '">' +
          '<span class="ep-no num">' + ('0' + (i + 1)).slice(-2) + '</span>' +
          '<span class="ep-title">' + esc(v.title) + '</span>' +
          '<span class="ep-side">' +
            (v.duration ? '<span class="ep-dur num">' + esc(v.duration) + '</span>' : '') +
            dl + '<span class="dot"></span>' +
          '</span></button></li>';
    }).join('');

    return '<section class="band" data-band="' + ci + '">' +
        '<div class="cover">' +
          (cover ? '<img src="' + cover + '" alt="' + esc(name) + ' 과정 표지" loading="lazy">' : '') +
          '<div class="cover-txt">' +
            '<div class="course-no num">과정 ' + ('0' + (ci + 1)).slice(-2) + '</div>' +
            '<h3 class="course-name">' + esc(name) + '</h3>' +
            '<p class="course-stat"><b>' + eps.length + '차시</b>' +
              (dlCount ? ' · 다운로드 ' + dlCount + '편' : ' · 재생 전용') + '</p>' +
            '<div class="now" data-now="' + ci + '"></div>' +
          '</div>' +
        '</div>' +
        '<ul class="eps">' + rows + '</ul>' +
      '</section>';
  }).join('');

  bindBands(courses, names);

  if (restoring) {
    let y = 0;
    try { y = parseInt(sessionStorage.getItem('kb_scroll') || '0', 10); } catch (e) {}
    if (y > 0) requestAnimationFrame(function () { window.scrollTo(0, y); });
  }
}

function groupByCourse(items) {
  const g = {};
  items.forEach(function (v) { (g[v.course] = g[v.course] || []).push(v); });
  return g;
}

function bindBands(courses, names) {
  document.querySelectorAll('.band').forEach(function (band) {
    const ci = band.dataset.band;
    const eps = courses[names[ci]];
    const now = band.querySelector('[data-now="' + ci + '"]');

    band.querySelectorAll('.ep').forEach(function (btn, i) {
      const v = eps[i];
      const show = function () {
        band.querySelectorAll('.ep').forEach(function (x) { x.classList.remove('active'); });
        btn.classList.add('active');
        now.textContent = ('0' + (i + 1)).slice(-2) + '   ' + v.title;
        now.classList.add('on');
      };
      btn.addEventListener('mouseenter', show);
      btn.addEventListener('focus', show);
      btn.addEventListener('click', function () { openPlayer(v); });
    });

    band.addEventListener('mouseleave', function () {
      now.classList.remove('on');
      band.querySelectorAll('.ep').forEach(function (x) { x.classList.remove('active'); });
    });

    band.querySelector('.cover').addEventListener('click', function () {
      const active = band.querySelector('.ep.active');
      const idx = active ? [].indexOf.call(band.querySelectorAll('.ep'), active) : 0;
      openPlayer(eps[idx]);
    });
  });
}

/* ---------- 플레이어 ---------- */
function openPlayer(v) {
  if (!v || !v.embedUrl) return;
  $('#vimeo').src = v.embedUrl + '&autoplay=1';
  $('#playingCourse').textContent = v.course;
  $('#playingTitle').textContent = v.title;
  $('#modal').classList.remove('hidden');
  $('#closeBtn').focus();
}

function closePlayer() {
  $('#vimeo').src = '';
  $('#modal').classList.add('hidden');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
</script>
</body>
</html>
